<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
 <meta name="description" content="KOB - Tech">
 <link rel="manifest" href="manifest.json">
 <meta name="theme-color" content="#0d1117">
 <meta name="mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-capable" content="yes">
 <meta name="apple-mobile-web-app-status-bar-style" content="default">
 <meta name="apple-mobile-web-app-title" content="Tayus Tech">
 <link rel="apple-touch-icon" href="image/kob.png">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  
<header class="head">
  <h1>KOB<span> TECH</span></h1>
</header>
 
     <!----- NAV BAR ----->
<div class="navbar">
<button class="cart-btn" onclick="toggleCart()">Cart (<span id="cart-count">0</span>)</button>
</div> 


<h2 class="typing">Welcome.. <span id="typing"></span></h2>

<main class="container">
<aside class="filters">
<h3>Filter Products</h3>
<div class="filter-group">
  <label for="type-filter">Category</label>
  <select id="type-filter" onchange="filterProducts()">
  <option value="all">All Types</option>
  <option value="Air Conditioner">Air Conditioner</option>
  <option value="Fridge">Fridge</option>
  <option value="Freezer">Freezer</option>
  <option value="Equipment">Equipment</option>
  <option value="Gadget">Gadget</option>
  <option value="Fashion">Fashion</option> 
  <option value="Audio">Audio/MP3</option>
  </select>
</div>
</aside>
<section>
<div class="product-grid" id="product-grid"></div>
</section>
</main>
  
  <aside class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h2>Your Cart</h2>
      <button class="close-btn" onclick="toggleCart()">&times;</button>
    </div>
    <div class="cart-items" id="cart-items">
      <p style="color: var(--text-muted);">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <h3>Total: <span id="cart-total">₦0</span></h3>
      <!-- Inside the cart-footer container -->
<button class="checkout-btn" onclick="openCheckoutModal()">Checkout via WhatsApp</button>

    </div>
  </aside>
  
  <!-- Checkout Modal -->
<div id="checkout-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:300; justify-content:center; align-items:center;">
  <div style="background: white; padding: 2rem; border-radius: 8px; max-width: 400px; width: 90%;">
    <h2 style="margin-bottom: 1rem;">Complete Your Order</h2>
    <form id="whatsapp-checkout-form" onsubmit="processWhatsAppCheckout(event)">
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Full Name</label>
        <input type="text" id="customer-name" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Phone Number</label>
        <input type="tel" id="customer-phone" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px;">
      </div>
      <div style="margin-bottom: 1rem;">
        <label style="display:block; font-size:0.9rem; margin-bottom:0.3rem;">Delivery Address / State</label>
        <textarea id="customer-address" required style="width:100%; padding:0.5rem; border:1px solid #ccc; border-radius:4px; height: 80px;"></textarea>
      </div>
      <div style="display:flex; gap: 0.5rem;">
        <button type="submit" style="flex:1; background:#25D366; color:white; border:none; padding:0.7rem; border-radius:4px; font-weight:bold; cursor:pointer;">Order via WhatsApp</button>
        <button type="button" onclick="closeCheckoutModal()" style="background:#64748b; color:white; border:none; padding:0.7rem; border-radius:4px; cursor:pointer;">Cancel</button>
      </div>
    </form>
  </div>
</div>


<!-- BACK TO TOP & BOTTOM -->
<button id="backToTop"> ↑ </button>
<button id="scrollToBottomBtn" onclick="scrollToBottom()" title="Go to bottom">↓</button>


<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">
<button class="nav-item active" data-page="Home">
  <a href="index.html"><i class="fa-solid fa-house"></i></a>
  <span>Home</span>
</button>
<button class="nav-item sell-btn" data-page="Sell">
  <a href="sell.html"><i class="fa-regular fa-square-plus"></i></a>
  <span>Sell</span>
</button>
<button class="nav-item" data-page="Saved">
<a href="service.html"><i class="fa-solid fa-tools"></i></a>
<span>Service</span>
</button>
<button class="nav-item" data-page="Messages">
<a href="message.html"><i class="fa-regular fa-message"></i></a>
<span>Contact</span>
</button>
<button class="nav-item" data-page="About">
<a href="about.html"><i class="fa-regular fa-user"></i></a>
<span>About</span>
</button>
<button class="nav-item" data-page="Faq">
  <a href="faq.html"><i class="fa-solid fa-question"></i></a>
  <span>Faq</span>
</button>
</nav>

<script src="script/index.js"></script>
</body>

</html>
