<body>
 
  <!--============================
      Sell / Trade-in Section 
==============================-->
<section id="sell" class="dark-bg">
<div class="sell">
<form id="sellForm" class="form-crd" onsubmit="handleEstimate(event)">
  <h2>Sell Your Old Appliance</h2>
 <p>Get instant value evaluation for your used AC or Refrigerator.</p>
<div class="form-group-grid">
<div class="input-grp">
  <label>Appliance Type</label>
  <select id="sellType" required>
   <option>Select Type</option>
   <option>Refrigerator</option>
   <option>Air Conditioner</option>
  </select> 
</div> 
<div class="input-grp">
 <label>Age of Appliance</label>
 <select id="sellAge" required>
 <option value="1">Under 1 Year</option>
 <option value="2">1 - 3 Years</option>
 <option value="4">4+ Years</option>
 </select>
</div>
<div class="input-grp">
 <label>Working Condition</label>
 <select id="sellCondition" required>
 <option value="excellent">Excellent (Like New)</option>
 <option value="good">Good (Minor wear)</option>
 <option value="faulty">Needs Repair / Faulty</option>
 </select>
</div>
</div>
  <div class="input-grp full-width">
   <label>Brand & Model Details</label>
   <input type="text" placeholder="e.g., Samsung French Door 2021 Model" required>
  </div>
  <button type="submit" class="btn primary-btn full-btn">Calculate Estimated Valuation</button>
</form>
  <div id="estimateResult" class="estimate-box"></div>
  
    <!-- Result Display Box -->
<div id="resultBox" style="display: none;"></div>
<!-- WhatsApp Submit Button (Hidden until valuation is calculated) -->
<button id="whatsappBtn" style="display: none; background-color: #25D366; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 8px; width: 100%; margin-top: 10px; cursor: pointer;">
  Submit Request via WhatsApp
</button>
</div>
</section>


<!-- BACK TO TOP & BOTTOM -->
