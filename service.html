<!-- ===============================
     REPAIR SERVICE BOOKING
================================ -->
<section id="repair" class="section">
   <h2>Schedule a Repair Service</h2>
   <p>
     Our certified engineers fix cooling issues, gas leaks, motor failures, and more.</p>
     <div class="repair-container">
    <!-- REPAIR INFORMATION -->
    <div class="repair-info">
      <img
        src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?auto=format&fit=crop&w=800&q=80"
        alt="Technician Repairing Appliance">
      <ul class="features-list">
        <li>
          <i class="fa-solid fa-circle-check"></i>
          Same-day doorstep inspection
        </li>
        <li>
          <i class="fa-solid fa-circle-check"></i>
          90-day post-repair warranty
        </li>
        <li>
          <i class="fa-solid fa-circle-check"></i>
          Original manufacturer spare parts
        </li>
      </ul>
    </div>
    <!-- BOOKING FORM -->
    <form class="form-card" id="repairForm">
      <div class="input-grp">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          required
          placeholder="Enter Fullname.."
        >
      </div>
      <div class="input-grp">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          required
          placeholder="+234 801 234 5678"
        >
      </div>
      <div class="input-grp">
        <label for="service">Service Needed</label>
        <select id="service" required>
          <option value="">--Select Service--</option>
          <option value="AC Gas Refill / Leak Repair">
            AC Gas Refill / Leak Repair
          </option>
          <option value="AC Not Cooling">
            AC Not Cooling
          </option>
          <option value="Fridge Freezing/Cooling Issue">
            Fridge Freezing/Cooling Issue
          </option>
          <option value="Compressor Replacement">
            Compressor Replacement
          </option>
          <option value="General Servicing & Cleaning">
            General Servicing & Cleaning
          </option>
        </select>
      </div>
      <div class="input-grp">
        <label for="datetime">Preferred Date & Time</label>
<input 
  type="text" 
  id="datetime" 
  name="datetime" 
  placeholder="Select date and time" 
  onfocus="(this.type='datetime-local')"
  onblur="if(!this.value) this.type='text'"
  required>


      </div>
      <div class="input-grp">
        <label for="address">Address</label>
        <input
          id="address"
          rows="3"
          required
          placeholder="Enter service address..."
        ></input>
      </div>
      <button
        type="submit"
        class="btn secondary-btn full-btn"
      >
        <i class="fa-brands fa-whatsapp"></i>
        Confirm Service Booking
      </button>
    </form>
  </div>
</section>
